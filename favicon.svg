<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Robo-Claude">
  <rect width="64" height="64" rx="14" fill="#0b0b0d"/>
  <!-- antenna -->
  <line x1="32" y1="9" x2="32" y2="17" stroke="#f0c75c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="2.6" fill="#7fd7c4"/>
  <!-- head / screen -->
  <rect x="14" y="17" width="36" height="30" rx="8" fill="none" stroke="#f0c75c" stroke-width="2.5"/>
  <!-- eyes -->
  <circle cx="25" cy="31" r="3.4" fill="#f0c75c"/>
  <circle cx="39" cy="31" r="3.4" fill="#f0c75c"/>
  <!-- mouth -->
  <path d="M24 39 q8 5 16 0" fill="none" stroke="#7fd7c4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- base -->
